name: GESA CLI prototype
on:
  push:
    branches: [main]
    paths: ['Cargo.*', 'src/**', 'tests/**', 'tools/**', '.github/workflows/cli.yml']
  pull_request:
    paths: ['Cargo.*', 'src/**', 'tests/**', 'tools/**', '.github/workflows/cli.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-acl-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose Windows ACL setup on a synthetic path
        shell: python
        run: |
          import os, pathlib, subprocess, tempfile
          source=pathlib.Path('src/config.rs').read_text(encoding='utf-8')
          section=source.split('fn windows_harden_path(',1)[1]
          script=section.split('r#"',1)[1].split('"#;',1)[0]
          script=script.replace('catch { exit 3 }', 'catch { Write-Output $_; exit 3 }')
          with tempfile.TemporaryDirectory(prefix='gesa-acl-diagnostic-') as path:
              exe=os.path.join(os.environ['SystemRoot'],'System32','WindowsPowerShell','v1.0','powershell.exe')
              result=subprocess.run([exe,'-NoLogo','-NoProfile','-NonInteractive','-Command',script],input=path+'\ndirectory\n',encoding='utf-8',capture_output=True,timeout=30)
              print(result.stdout)
              print(result.stderr)
              raise SystemExit(result.returncode)
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: gesa-${{ matrix.os }}
          path: |
            target/release/gesa
            target/release/gesa.exe
            target/release/gesa-launcher
            target/release/gesa-launcher.exe
  protocol-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: cargo build --locked
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - run: python tools/e2e.py --bin target/debug/gesa --launcher target/debug/gesa-launcher
